apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: reliabilityos
  title: ReliabilityOS
  description: Plataforma de SRE com observabilidade, SLOs e resposta a incidentes no Kubernetes.
  annotations:
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://grafana.gabrielstudying.click
      title: Grafana
    - url: https://argocd.gabrielstudying.click
      title: Argo CD
    - url: https://orders.gabrielstudying.click
      title: API de pedidos
spec:
  owner: user:alves0611
  domain: reliability
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-api
  title: API de pedidos
  description: API REST em FastAPI para pedidos, instrumentada com métricas, logs e traces.
  annotations:
    github.com/project-slug: Alves0611/reliabilityos
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://orders.gabrielstudying.click
      title: API de pedidos
spec:
  type: service
  lifecycle: production
  owner: user:alves0611
  system: reliabilityos
  dependsOn:
    - component:orders-worker
    - resource:reliabilityos-postgresql
    - resource:reliabilityos-rabbitmq
    - resource:reliabilityos-redis
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: orders-worker
  title: Worker de pedidos
  description: Worker Celery que processa pedidos de forma assíncrona, com autoscaling por KEDA.
  annotations:
    github.com/project-slug: Alves0611/reliabilityos
spec:
  type: service
  lifecycle: production
  owner: user:alves0611
  system: reliabilityos
  dependsOn:
    - resource:reliabilityos-postgresql
    - resource:reliabilityos-rabbitmq
    - resource:reliabilityos-redis
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: reliabilityos-postgresql
  title: PostgreSQL de pedidos
  description: Banco PostgreSQL 16 dos pedidos.
spec:
  type: database
  owner: user:alves0611
  system: reliabilityos
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: reliabilityos-rabbitmq
  title: RabbitMQ de pedidos
  description: Fila RabbitMQ com dead-letter exchange para o processamento de pedidos.
spec:
  type: queue
  owner: user:alves0611
  system: reliabilityos
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: reliabilityos-redis
  title: Redis de pedidos
  description: Cache Redis e backend de resultados do Celery.
spec:
  type: cache
  owner: user:alves0611
  system: reliabilityos
